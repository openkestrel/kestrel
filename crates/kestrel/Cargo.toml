[package]
name = "kestrel"
description = "kestrel's control plane: one binary, roles selected by argv."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kestrel-control-plane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kestrel-operator-types = { path = "../kestrel-operator-types" }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-core = "0.3"
getrandom = { version = "0.4", features = ["std"] }
hmac = "0.13"
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = "9"
libc = "0.2"
minijinja = { version = "2.24", features = ["fuel"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }
yaml_serde = "0.10"

[dev-dependencies]
kestrel-scripted-agent = { path = "../kestrel-scripted-agent" }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
regex = "1"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["test-util"] }
toml = "0.8"
