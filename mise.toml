# rust is pinned in rust-toolchain.toml. This setting replaces the global list, not extends it.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
python = "3.14.7"
bun = "1.3.14"
caddy = "2.11.4"
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }

[env]
# Must be absolute: the tests' nested `cargo build` runs from another directory.
CARGO_TARGET_DIR = "{{config_root}}/target"

# CI's `Check generated operator types` step runs this task, so dropping a line here would weaken
# CI too, not just the local run.
[tasks.generate-check]
description = "Regenerate the operator types and fail if the committed copies drift"
run = """
set -e
cargo run --locked -p kestrel-operator-types --bin generate --features generate
git diff --exit-code -- crates/kestrel-operator-types/src packages/client/src/operator/sse.gen.ts
"""

# Git never installs hooks on clone, so the first `mise install` does it, and an activated shell
# repeats it on entry for clones whose tools were already installed.
[hooks]
postinstall = "git config core.hooksPath .githooks"
enter = "git config core.hooksPath .githooks"
