name: Docker Hub mirror
description: >-
  Pulls Docker Hub images through mirror.gcr.io, falling back to Docker Hub itself and waiting out a
  transient failure, so a Docker Hub outage or rate limit does not fail the job. Covers the daemon
  (pulls, `docker build`, compose) and, with `buildx`, the BuildKit builder it sets up and that
  builder's own image.

inputs:
  buildx:
    description: Also set up a docker-container buildx builder that pulls through the mirror.
    default: "false"

runs:
  using: composite
  steps:
    - name: Pull Docker Hub images through the mirror
      shell: bash
      run: |
        set -euo pipefail
        config=/etc/docker/daemon.json
        current=$(sudo cat "${config}" 2>/dev/null || echo '{}')
        jq '."registry-mirrors" = ["https://mirror.gcr.io"]' <<< "${current}" | sudo tee "${config}" > /dev/null
        sudo systemctl restart docker
        docker info --format '{{json .RegistryConfig.Mirrors}}'

    # buildx inspects its builder image on Docker Hub directly, bypassing the daemon's mirror.
    - id: mirrored
      if: inputs.buildx == 'true'
      continue-on-error: true
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - id: plain
      if: inputs.buildx == 'true' && steps.mirrored.outcome == 'failure'
      continue-on-error: true
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    # A 504 on the anonymous token request behind that pull failed 28 jobs in one afternoon, and it
    # clears: the mirror route is tried once more, after a wait, before the job gives up on it
    # (docs/agents/flakes.md).
    - name: Wait before the last attempt at the builder
      if: inputs.buildx == 'true' && steps.plain.outcome == 'failure'
      shell: bash
      run: sleep 30

    - if: inputs.buildx == 'true' && steps.plain.outcome == 'failure'
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
