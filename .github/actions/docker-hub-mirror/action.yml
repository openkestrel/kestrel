name: Docker Hub mirror
description: >-
  Pulls Docker Hub images through mirror.gcr.io, falling back to Docker Hub itself, so a Docker
  Hub outage or rate limit does not fail the job. Covers the daemon (pulls, `docker build`,
  compose, the buildx builder's own image) and, with `buildx`, the BuildKit builder it sets up.

inputs:
  buildx:
    description: Also set up a docker-container buildx builder that pulls through the mirror.
    default: "false"

runs:
  using: composite
  steps:
    - name: Pull Docker Hub images through the mirror
      shell: bash
      run: |
        set -euo pipefail
        config=/etc/docker/daemon.json
        current=$(sudo cat "${config}" 2>/dev/null || echo '{}')
        jq '."registry-mirrors" = ["https://mirror.gcr.io"]' <<< "${current}" | sudo tee "${config}" > /dev/null
        sudo systemctl restart docker
        docker info --format '{{json .RegistryConfig.Mirrors}}'

    - if: inputs.buildx == 'true'
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
