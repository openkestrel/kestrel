name: CI

# The merge gate (ADR-0027): every pull request and every merge-queue entry runs it, and
# nothing filters it. `paths:` is impossible on `merge_group`, and a workflow kept from
# starting leaves its required check pending forever, so which areas run is decided inside,
# by the `changes` job, rather than by the trigger.
on:
  pull_request:
  merge_group:

# A queue entry is keyed to its own merge group, never the branch, so parallel siblings cannot
# cancel one another (ADR-0027).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      images: ${{ steps.detect.outputs.images }}
      arm64: ${{ steps.detect.outputs.arm64 }}
      compose: ${{ steps.detect.outputs.compose }}
      client: ${{ steps.detect.outputs.client }}
      release: ${{ steps.detect.outputs.release }}
      tree: ${{ steps.tree.outputs.sha }}
      reused: ${{ steps.earlier.outputs.run != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Name the tree under test
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # A queue entry whose exact tree already passed the gate is not run again (ADR-0042). Only a
      # run from this repository counts: a fork's run could record a pass for any tree it liked.
      - name: Look for an earlier pass of this tree
        id: earlier
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.sha }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gate-passed-${TREE}" --jq '
            [.artifacts[]
              | select(.expired | not)
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
            ][0].workflow_run.id // empty')
          if [[ -n "${run}" ]]; then
            echo "run=${run}" >> "$GITHUB_OUTPUT"
            echo "Tree \`${TREE}\` passed the gate in [run ${run}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run}), so no area runs again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Work out which areas the change touches
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EARLIER: ${{ steps.earlier.outputs.run }}
        run: |
          set -euo pipefail
          if [[ -n "${EARLIER}" ]]; then
            for area in rust images arm64 compose client client-image release; do
              echo "${area}=false" >> "$GITHUB_OUTPUT"
            done
          elif [[ -n "${BASE}" && -n "${HEAD}" ]]; then
            git diff --name-only "${BASE}...${HEAD}" | .github/scripts/changed-areas.sh
          else
            .github/scripts/changed-areas.sh < /dev/null
          fi

  files:
    name: files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Hold added and modified files to the token budget
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: .githooks/pre-commit "${BASE}" "${HEAD}"

      - name: Refuse docs that name a missing path or test
        run: python3 scripts/doc-references.py

  release-version:
    name: release-version
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: python

      - name: Test preparation and version refusals
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: mise exec -- python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  lint:
    name: lint (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rust version comes from rust-toolchain.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: ./.github/actions/pinned-rust

      # One cache shared by every job that compiles Rust; only Main's push to main writes it (ADR-0027).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check generated operator types
        env:
          # This job installs only rust; without this, `mise run` would install every other tool in
          # mise.toml.
          MISE_AUTO_INSTALL: "false"
        run: mise run generate-check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --features kestrel-operator-types/generate -- -D warnings

      - name: Check the registry retry helper
        run: bash .github/scripts/test-retry.sh

  workspace-archive:
    name: workspace (archive)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust github:nextest-rs/nextest

      - uses: ./.github/actions/pinned-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - name: Build the binaries
        run: cargo build --locked --workspace

      - name: Archive the tests and executable helpers
        run: cargo nextest archive --locked --workspace --profile ci --archive-file workspace.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: workspace
          path: workspace.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  workspace:
    name: workspace (rust, ${{ matrix.shard }}/3)
    needs: [changes, workspace-archive]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      KESTREL_TEST_HELPERS: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: github:nextest-rs/nextest

      - uses: actions/download-artifact@v8
        with:
          name: workspace
          path: ${{ runner.temp }}

      - name: Test the shard from the archive
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file "${RUNNER_TEMP}/workspace.tar.zst"
          --workspace-remap "${GITHUB_WORKSPACE}"
          --extract-to "${GITHUB_WORKSPACE}"
          --partition hash:${{ matrix.shard }}/3

  helpers:
    name: helpers (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust github:nextest-rs/nextest

      - uses: ./.github/actions/pinned-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - name: Check executable helper preparation
        run: bash .github/scripts/test-helper-preparation.sh

  # The e2e suite drives the built Client through the Client image's Caddyfile and a control plane
  # it compiles, so it needs Caddy and Rust too.
  client:
    name: client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust bun caddy

      - uses: ./.github/actions/pinned-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run check

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Test the built Client against a control plane
        run: bun run e2e

  # Each image is built once for the change and pushed tagged by the commit, so every job that
  # needs one pulls rather than builds it (ADR-0027). Layer caching is restored on every run from
  # each image's `buildcache` tag, which only Main's image-cache job writes (ADR-0027). The
  # image inputs changed with the Rust sources, so these follow the `images` area.
  build-env:
    name: kestrel-env (build)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-image
        with:
          image: kestrel-env
          repository: ghcr.io/${{ github.repository }}-env

  build-control-plane:
    name: kestrel (build)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-image
        with:
          image: kestrel
          repository: ghcr.io/${{ github.repository }}

  build-client:
    name: kestrel-client (build)
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-image
        with:
          image: kestrel-client
          repository: ghcr.io/${{ github.repository }}-client

  # The heavy suites compile once, beside the image builds rather than after them, and every job
  # that runs one restores them through `.github/actions/suites`.
  suites:
    name: kestrel (suites)
    needs: changes
    if: needs.changes.outputs.images == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: ./.github/actions/pinned-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - name: Compile the heavy suites
        run: .github/scripts/compile-suites.sh suites.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: suites
          path: suites.tar.zst
          compression-level: 0
          retention-days: 1

  image:
    name: kestrel-env (image)
    needs: [changes, build-env, suites]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kestrel
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/suites

      - uses: ./.github/actions/docker-hub-mirror

      - name: Pull the image this change built
        run: docker pull "${KESTREL_ENV_IMAGE_SOURCE}"

      - name: Test the image
        run: |
          "${SUITES}/image" --ignored

      - name: Test the Docker driver
        run: |
          "${SUITES}/docker" --ignored

      - name: Test the image capability checks
        run: |
          "${SUITES}/capability" --ignored

      # One harness, one model stub and one host daemon, so a Session at a time.
      - name: Test the harness the image ships
        run: |
          "${SUITES}/opencode" --ignored --test-threads 1

  development:
    name: kestrel-dev (image)
    needs: [changes, build-env, suites]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kestrel
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/suites

      - uses: ./.github/actions/docker-hub-mirror

      - name: Pull the image this change built
        run: docker pull "${KESTREL_ENV_IMAGE_SOURCE}"

      # kestrel_passes_its_own_checks compiles the workspace three times, so the scheduled
      # Development image workflow runs it instead.
      - name: Test the image
        run: |
          started=$(date +%s)
          "${SUITES}/development" --ignored --skip kestrel_passes_its_own_checks
          image=$(docker image ls --filter 'reference=kestrel-dev:test-*' --format '{{.Repository}}:{{.Tag}}' | head -n 1)
          size=$(docker image inspect "$image" --format '{{.Size}}')
          echo "kestrel-dev: $((size / 1024 / 1024)) MiB, built and tested in $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  control-plane:
    name: kestrel (image)
    needs: [changes, build-control-plane, suites]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kestrel
    env:
      KESTREL_CONTROL_IMAGE_SOURCE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/suites

      - uses: ./.github/actions/docker-hub-mirror

      - name: Pull the image this change built
        run: docker pull "${KESTREL_CONTROL_IMAGE_SOURCE}"

      - name: Test the image
        run: |
          "${SUITES}/control_plane" --ignored

  compose:
    name: kestrel (compose)
    needs: [changes, build-env, build-control-plane, build-client, suites]
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kestrel
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
      KESTREL_CONTROL_IMAGE_SOURCE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      KESTREL_CLIENT_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-client:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/suites

      - uses: ./.github/actions/docker-hub-mirror

      - name: Pull the images this change built
        run: |
          docker pull "${KESTREL_ENV_IMAGE_SOURCE}"
          docker pull "${KESTREL_CONTROL_IMAGE_SOURCE}"
          docker pull "${KESTREL_CLIENT_IMAGE_SOURCE}"

      # A checkout's compose suite is scoped to a namespace derived from its path, so the
      # stack comes up once at a time per checkout rather than once per machine.
      - name: Test the compose path
        run: |
          "${SUITES}/compose" --ignored --test-threads 1

      # The sweep every suite runs first, exercised against the resources a deleted checkout
      # leaves behind.
      - name: Test the sweep
        run: |
          "${SUITES}/cleanup" --ignored

  # The only job that builds the arm64 half of the image: the release it pins, the checksum it
  # verifies, and the architecture it selects on.
  architectures:
    name: images (arm64)
    needs: changes
    if: needs.changes.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/docker-hub-mirror
        with:
          buildx: true

      - name: Build the harness for arm64
        run: |
          docker buildx build --platform linux/arm64 --target opencode \
            --output type=cacheonly --file images/kestrel-env/Dockerfile .

      - name: Build the adapters for arm64
        run: |
          docker buildx build --platform linux/arm64 --target adapters \
            --output type=cacheonly --file images/kestrel-env/Dockerfile .

      - name: Build gh for arm64
        run: |
          docker buildx build --platform linux/arm64 --target gh \
            --output type=cacheonly --file images/kestrel-env/Dockerfile .

  # The one status the ruleset and the merge queue require. It runs whether an area ran,
  # failed or was skipped: a job skipped by its condition reports success, and only a check
  # that never reports at all strands a pull request.
  gate:
    name: gate
    needs:
      - changes
      - files
      - release-version
      - lint
      - workspace-archive
      - workspace
      - helpers
      - build-env
      - build-control-plane
      - build-client
      - image
      - development
      - control-plane
      - compose
      - suites
      - client
      - architectures
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when an area failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Report the gate
        run: echo "Every area passed or was skipped."

      # A reused pass records nothing, so a tree's pass expires a day after it last actually ran.
      - name: Record that this tree passed
        if: >-
          needs.changes.outputs.reused != 'true'
          && (github.event_name == 'merge_group'
            || github.event.pull_request.head.repo.full_name == github.repository)
        run: echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > gate-passed

      - uses: actions/upload-artifact@v7
        if: >-
          needs.changes.outputs.reused != 'true'
          && (github.event_name == 'merge_group'
            || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: gate-passed-${{ needs.changes.outputs.tree }}
          path: gate-passed
          retention-days: 1
          if-no-files-found: error
          overwrite: true
