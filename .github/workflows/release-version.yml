name: Release version preparation

on:
  pull_request:
    paths:
      - scripts/release.py
      - scripts/tests/test_release.py
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - packages/**/package.json
      - packages/client/public/version.json
      - CHANGELOG.md
      - .github/workflows/release-version.yml
  merge_group:

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test preparation and version refusals
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: python3 -m unittest discover -s scripts/tests -p test_release.py
