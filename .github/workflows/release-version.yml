name: Release version preparation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test preparation and version refusals
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: python3 -m unittest discover -s scripts/tests -p test_release.py
