name: Main

# What a push to main does that a pull request does not (ADR-0027): it publishes the control-plane
# and Client images when their inputs changed — `latest` tracks those inputs, not every commit
# that lands — and publishes them under their version on a release tag. It is not a required check, so it
# may name the branches and tags it runs on, and it builds from a clean checkout so what is
# published is what the Dockerfile yields on its own.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      client-image: ${{ steps.detect.outputs.client-image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out whether the image's inputs changed
        id: detect
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A release tag and a newly created branch name a tree with nothing in front of it,
          # and reading that as a change to every area publishes rather than silently skipping.
          if [[ -n "${BASE}" && ! "${BASE}" =~ ^0+$ ]]; then
            git diff --name-only "${BASE}...${HEAD}" | .github/scripts/changed-areas.sh
          else
            .github/scripts/changed-areas.sh < /dev/null
          fi

  # The only writers of the caches CI restores: CI never runs on a push, so a save there
  # conditioned on one never fires (ADR-0027).
  rust-cache:
    name: rust (cache)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies

      - name: Build what the gate builds
        run: |
          cargo clippy --locked --workspace --all-targets
          cargo build --locked --workspace
          cargo test --locked --workspace --no-run

  bun-cache:
    name: bun (cache)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

  supervisor-size:
    name: supervisor size
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Record the supervisor binary's size
        run: |
          cargo build --locked --release --package kestrel-supervisor
          size=$(wc -c < target/release/kestrel-supervisor)
          echo "kestrel-supervisor: $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: kestrel (publish)
    needs: changes
    if: needs.changes.outputs.images == 'true' || needs.changes.outputs.client-image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/docker-hub-mirror

      - name: Publish the control-plane and Client images
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          CONTROL_PLANE_CHANGED: ${{ needs.changes.outputs.images }}
          CLIENT_CHANGED: ${{ needs.changes.outputs.client-image }}
        run: |
          set -euo pipefail
          changed=()
          [[ "${CONTROL_PLANE_CHANGED}" == "true" ]] && changed+=("kestrel:${REPOSITORY}")
          [[ "${CLIENT_CHANGED}" == "true" ]] && changed+=("kestrel-client:${REPOSITORY}-client")
          for published in "${changed[@]}"; do
            dockerfile="images/${published%%:*}/Dockerfile"
            image="${published#*:}"
            # A release is published under its version; a push to main moves `latest` and pins
            # the commit it was built from.
            image_refs=("${image}:latest" "${image}:${GITHUB_SHA}")
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              image_refs=("${image}:${GITHUB_REF_NAME}")
            fi
            tags=()
            for ref in "${image_refs[@]}"; do
              tags+=(--tag "$ref")
            done
            docker build --file "${dockerfile}" "${tags[@]}" .
            for ref in "${image_refs[@]}"; do
              docker push "$ref"
            done
          done
