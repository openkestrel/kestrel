name: Flakes

# The gate fails a test that passes only on retry, and a queue entry whose tree already passed is
# not run again (ADR-0042), so neither catches a flake the suite has not shown yet. This does: the
# default suite, over and over, on the runners the gate uses.
on:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:
    inputs:
      test_filter:
        description: Nextest test filter (empty runs the workspace)
        type: string
        default: ''
      stress_count:
        description: Repetitions (0 uses the scheduled 45 minute duration)
        type: number
        default: 0
      revision:
        description: Commit to test (empty uses the workflow revision)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  stress:
    name: default suite under stress
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: jdx/mise-action@v4
        with:
          install_args: rust github:nextest-rs/nextest

      - uses: ./.github/actions/pinned-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: false

      - uses: ./.github/actions/fetch-dependencies

      - name: Run the suite under stress
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          STRESS_COUNT: ${{ inputs.stress_count || 0 }}
        run: |
          set -o pipefail
          if [[ "$STRESS_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            stress=(--stress-count "$STRESS_COUNT")
          else
            stress=(--stress-duration 45m)
          fi
          if [[ -n "$TEST_FILTER" ]]; then
            cargo nextest run --locked -p kestrel --test suite --profile stress "${stress[@]}" "$TEST_FILTER" 2>&1 | tee nextest.log
          else
            cargo nextest run --locked --workspace --profile stress "${stress[@]}" 2>&1 | tee nextest.log
          fi

      - name: Name the tests that failed
        if: failure()
        run: |
          {
            echo "| Failures | Test |"
            echo "| --- | --- |"
            grep -E '^\s+FAIL ' nextest.log | sort -u | sed -E 's/.*\([0-9]+\/[0-9]+\) //' \
              | sort | uniq -c | sort -rn | awk '{ n = $1; $1 = ""; print "| " n " |" $0 " |" }'
          } >> "$GITHUB_STEP_SUMMARY"
